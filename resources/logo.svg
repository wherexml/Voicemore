<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<title>Voicemore</title>
<desc>Five white rounded voice strokes forming a V with a mint accent on an indigo macOS tile.</desc>
<defs>
 <linearGradient id="tile" x1="172" y1="96" x2="850" y2="940" gradientUnits="userSpaceOnUse"><stop stop-color="#343B85"/><stop offset=".55" stop-color="#20284F"/><stop offset="1" stop-color="#101B35"/></linearGradient>
 <linearGradient id="shine" x1="512" y1="96" x2="512" y2="928" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
</defs>
<rect x="72" y="72" width="880" height="880" rx="206" fill="url(#tile)"/>
<rect x="75" y="75" width="874" height="874" rx="203" stroke="url(#shine)" stroke-width="6"/>
<g stroke="#F7FAFF" stroke-width="62" stroke-linecap="round">
 <path d="M292 366v142"/><path d="M402 410v190"/><path d="M512 468v218"/><path d="M622 410v190"/><path d="M732 366v142"/>
